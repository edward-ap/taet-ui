name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # Windows runner reported ERR_NO_BUFFER_SPACE during module loading.
    # Keep the complete suite; budget independent browser processes per VM.
    env:
      TAET_UI_WORKERS: ${{ matrix.os == 'windows-latest' && '2' || '32' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: npm pack --dry-run
      - run: npm run release:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.os }}-${{ matrix.node }}
          path: test-results/
          retention-days: 7
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:compat
      - run: npm run test:bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: compatibility-failures
          path: |
            test-results/compat/
            test-results/bundle/
  macos:
    # Avoid paying for both push and PR runs of the same feature branch.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    # Expanded editing suite retains two workers and every existing assertion.
    timeout-minutes: 90
    env:
      TAET_UI_WORKERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:all
      # test:all built dist. Reuse it without concurrent rebuilds.
      - run: node scripts/run-browser.js --config playwright.compat.config.js --project=firefox --project=webkit --workers=2
      - run: node scripts/check-bundle.js
      - run: node scripts/run-browser.js --config playwright.bundle.config.js --workers=2
      - run: npm pack --dry-run
      - run: npm run release:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: macos-browser-failures
          path: test-results/
          retention-days: 7
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: grid-workloads
          path: test-results/grid-workloads/
          retention-days: 7
