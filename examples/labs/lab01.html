<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tæt UI Lab 01</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../src/ui/taet-ui.css" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: var(--dui-font-family);
        font-size: var(--dui-font-size);
        line-height: var(--dui-line-height);
        color: var(--dui-text);
        background: #f7f7f7;
      }

      .lab-shell {
        width: min(760px, 100%);
      }

      .lab-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--dui-gap-sm);
        margin-bottom: var(--dui-gap-md);
      }

      .lab-nav {
        display: flex;
        gap: var(--dui-gap-sm);
        margin-bottom: var(--dui-gap-md);
      }

      .lab-nav a {
        color: #1f5f9f;
        text-decoration: none;
      }

      .lab-button {
        box-sizing: border-box;
        height: var(--dui-control-height);
        padding: 2px 8px;
        border: 1px solid var(--dui-border-color);
        background: #ffffff;
        color: var(--dui-text);
        font-family: var(--dui-font-family);
        font-size: var(--dui-font-size);
        line-height: var(--dui-line-height);
        cursor: default;
      }

      .lab-button:active {
        background: #e8eef7;
      }

      #app {
        box-sizing: border-box;
        width: min(420px, 100%);
        padding: var(--dui-gap-md);
        border: 1px solid #c8c8c8;
        background: #ffffff;
        margin-bottom: var(--dui-gap-md);
      }

      #log {
        box-sizing: border-box;
        width: min(640px, 100%);
        height: 220px;
        overflow: auto;
        border: 1px solid #c8c8c8;
        padding: 6px;
        background: #ffffff;
        color: #242424;
      }

      #log div {
        min-height: var(--dui-line-height);
        border-bottom: 1px solid #eeeeee;
      }
    </style>
    <link rel="stylesheet" href="./labs.css" />
  </head>
  <body>
    <main class="lab-shell">
      <nav class="lab-nav">
        <a href="./lab01.html">Lab 01</a>
        <a href="./lab02.html">Lab 02</a>
        <a href="./lab03.html">Lab 03</a>
        <a href="./lab04.html">Lab 04</a>
        <a href="./lab05.html">Lab 05</a>
        <a href="./lab06.html">Lab 06</a>
        <a href="./lab07.html">Lab 07</a>
        <a href="./lab08.html">Lab 08</a>
        <a href="./lab09.html">Lab 09</a>
        <a href="./lab10.html">Lab 10</a>
        <a href="./lab11.html">Lab 11</a>
        <a href="./lab12.html">Lab 12</a>
        <a href="./lab13.html">Lab 13</a>
        <a href="./lab14.html">Lab 14</a>
        <a href="./lab15.html">Lab 15</a>
        <a href="./lab16.html">Lab 16</a>
        <a href="./lab17.html">Lab 17</a>
        <a href="./lab18.html">Lab 18</a>
        <a href="./lab19.html">Lab 19</a>
        <a href="./lab20.html">Lab 20</a>
        <a href="./lab21.html">Lab 21</a>
        <a href="./lab22.html">Lab 22</a>
        <a href="./lab23.html">Lab 23</a>
      </nav>

      <div class="lab-toolbar">
        <button class="lab-button" id="set-api" type="button">Set API</button>
        <button class="lab-button" id="set-silent" type="button">Set Silent Import</button>
        <button class="lab-button" id="clear" type="button">Clear</button>
        <button class="lab-button" id="disable" type="button">Disable</button>
        <button class="lab-button" id="enable" type="button">Enable</button>
        <button class="lab-button" id="focus" type="button">Focus</button>
        <button class="lab-button" id="destroy" type="button">Destroy</button>
      </div>

      <div id="app"></div>
      <div id="log" aria-live="polite"></div>
    </main>

    <script type="module" src="./lab01.js"></script>
  </body>
</html>
