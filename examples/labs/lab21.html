<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tæt UI Lab 21</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../src/ui/taet-ui.css?v=21.26" />
    <style>
      body.dui-page--full {
        display: flex;
        flex-direction: column;
      }

      #root {
        flex: 1 1 auto;
        min-height: 0;
      }

      .dui-lab21-panel {
        display: grid;
        align-content: start;
        gap: var(--dui-gap-md);
        width: 100%;
        height: 100%;
        padding: var(--dui-gap-md);
      }

      .dui-lab21-main {
        overflow: auto;
      }

      .dui-lab21-step-progress {
        max-width: min(900px, 100%);
        margin-bottom: var(--dui-gap-md);
      }

      .dui-lab21-actions {
        display: grid;
        gap: var(--dui-gap-sm);
      }

      .dui-lab21-actions .dui-button {
        width: 100%;
      }

      .dui-lab21-eq {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: end;
        gap: var(--dui-gap-sm);
        min-height: 210px;
      }

      .dui-lab21-eq .dui-trackbar {
        grid-template-columns: 1fr;
        justify-items: center;
        --dui-label-width: 0px;
        --dui-trackbar-vertical-height: 176px;
      }

      .dui-lab21-eq .dui-trackbar__label {
        width: 100%;
        text-align: center;
      }

      .dui-lab21-eq .dui-trackbar__content {
        justify-content: center;
      }
    </style>
    <link rel="stylesheet" href="./labs.css" />
  </head>
  <body class="dui-page dui-page--full dui-theme-light-blue dui-profile-compact" data-theme="light-blue">
    <div id="root"></div>
    <script type="module" src="./lab21.js?v=21.26"></script>
  </body>
</html>
